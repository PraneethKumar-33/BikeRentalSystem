{% extends 'rentals/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">
                    <i class="fas fa-motorcycle me-2"></i>Booking: {{ bike.make }} {{ bike.model }}
                </h4>
            </div>
            
            <div class="card-body">
                <p class="text-muted">Rate: <strong>${{ bike.daily_rate }}/day</strong></p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            <strong>Error:</strong> Please check the dates entered.
                        </div>
                    {% endif %}
                    
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">Start Date</label>
                            {{ form.start_date }}
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-bold">End Date</label>
                            {{ form.end_date }}
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">
                        <i class="fas fa-check me-2"></i> Confirm Booking
                    </button>
                    
                    <a href="{% url 'bike_details' bike.id %}" class="btn btn-outline-secondary w-100 mt-2">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
