{% extends 'rentals/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Confirm Delete</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Are you sure you want to remove this bike?</p>
                <h3 class="fw-bold mb-4">{{ bike.make }} {{ bike.model }}</h3>
                
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger w-100 mb-2">Yes, Delete it</button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary w-100">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
